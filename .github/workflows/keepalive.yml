name: Keepalive

# Раз в неделю делает крошечный коммит, чтобы репозиторий считался активным.
# Публичные репозитории GitHub отключают scheduled-workflow после 60 дней без
# активности — этот коммит сбрасывает счётчик с большим запасом (7 дней << 60).

on:
  schedule:
    - cron: "30 5 * * 1"   # каждый понедельник 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive timestamp and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || { echo "Нет изменений — пропуск"; exit 0; }
          git push
